<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jarvis AI Assistant</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --accent:    #58a6ff;
      --green:     #3fb950;
      --yellow:    #d29922;
      --red:       #f85149;
      --purple:    #bc8cff;
      --orange:    #f0883e;
      --text:      #e6edf3;
      --text-dim:  #8b949e;
      --radius:    12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; background: var(--border); color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .badge.pro   { background: #1f3a5f; color: var(--accent); }
    .badge.enterprise { background: #1a3a2a; color: var(--green); }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red); transition: background 0.3s;
    }
    .status-dot.online { background: var(--green); }

    .status-text { font-size: 12px; color: var(--text-dim); }

    .btn-icon {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: var(--surface2); color: var(--text); }

    /* ── Layout ───────────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 8px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 11px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px;
      padding: 8px 0 4px;
    }

    .quick-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 8px;
      cursor: pointer; font-size: 13px; text-align: left;
      transition: all 0.2s; width: 100%;
    }
    .quick-btn:hover { background: var(--border); border-color: var(--accent); }
    .quick-btn .icon { margin-right: 8px; }

    .info-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 12px;
      color: var(--text-dim); line-height: 1.6;
    }
    .info-box span { color: var(--text); font-weight: 500; }

    /* ── Chat Area ────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Message Bubbles ──────────────────────────────────── */
    .msg { display: flex; gap: 12px; max-width: 820px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.jarvis { align-self: flex-start; }
    .msg.system-msg { align-self: center; }

    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; font-weight: 700;
    }
    .avatar.user-av   { background: #1f3a5f; color: var(--accent); }
    .avatar.jarvis-av { background: #1a3a2a; color: var(--green); }

    .bubble {
      padding: 12px 16px; border-radius: var(--radius);
      line-height: 1.6; font-size: 14px; max-width: 680px;
      word-break: break-word;
    }
    .msg.user   .bubble { background: #1f3a5f; color: var(--text); border-bottom-right-radius: 4px; }
    .msg.jarvis .bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }

    .bubble pre {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; margin: 8px 0;
      overflow-x: auto; font-size: 13px; font-family: 'Consolas', monospace;
      white-space: pre-wrap;
    }

    .bubble code {
      background: var(--bg); padding: 2px 6px; border-radius: 4px;
      font-family: 'Consolas', monospace; font-size: 13px;
    }

    /* ── Agent Steps ──────────────────────────────────────── */
    .steps-container {
      margin-top: 8px; border-left: 2px solid var(--border);
      padding-left: 12px; display: flex; flex-direction: column; gap: 4px;
    }

    .step {
      font-size: 12px; padding: 4px 8px; border-radius: 6px;
      font-family: 'Consolas', monospace;
    }
    .step.thought { color: var(--purple); }
    .step.action  { color: var(--orange); background: rgba(240,136,62,0.08); }
    .step.result  { color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); }

    .system-pill {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 12px; padding: 4px 14px;
      border-radius: 20px;
    }

    /* ── Typing indicator ─────────────────────────────────── */
    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input Area ───────────────────────────────────────── */
    .input-area {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 12px;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: inherit;
      resize: none; max-height: 120px; min-height: 24px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--text-dim); }

    .send-btn {
      background: var(--accent); color: #0d1117;
      border: none; border-radius: 8px; padding: 8px 16px;
      cursor: pointer; font-size: 14px; font-weight: 600;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send-btn:hover { background: #79c0ff; }
    .send-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

    .input-hint {
      font-size: 11px; color: var(--text-dim); margin-top: 6px;
      text-align: center;
    }

    /* ── Settings Panel ───────────────────────────────────── */
    .panel-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .panel-overlay.open { display: flex; }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; width: 480px; max-width: 95vw;
      max-height: 90vh; overflow-y: auto;
    }

    .panel h2 { font-size: 18px; color: var(--accent); margin-bottom: 20px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }

    .panel-btn {
      background: var(--green); color: #0d1117; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600; margin-right: 8px;
      transition: all 0.2s;
    }
    .panel-btn:hover { opacity: 0.85; }
    .panel-btn.cancel { background: var(--border); color: var(--text); }

    .save-msg { font-size: 13px; color: var(--green); margin-top: 8px; }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .bubble  { max-width: 90vw; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">⚡ JARVIS</div>
  <span class="badge" id="tier-badge">FREE</span>
  <div class="header-right">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Connecting...</span>
    <button class="btn-icon" onclick="openSettings()">⚙ Settings</button>
    <button class="btn-icon" onclick="clearChat()">🗑 Clear</button>
  </div>
</header>

<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Quick Commands</div>

    <button class="quick-btn" onclick="send('What time is it?')"><span class="icon">🕐</span>Current time</button>
    <button class="quick-btn" onclick="send('Show system info')"><span class="icon">💻</span>System info</button>
    <button class="quick-btn" onclick="send('Check battery')"><span class="icon">🔋</span>Battery status</button>
    <button class="quick-btn" onclick="send('Take a screenshot')"><span class="icon">📸</span>Screenshot</button>
    <button class="quick-btn" onclick="send('List files on Desktop')"><span class="icon">📁</span>Desktop files</button>
    <button class="quick-btn" onclick="send('List running processes')"><span class="icon">⚙</span>Processes</button>
    <button class="quick-btn" onclick="send('Open YouTube')"><span class="icon">▶</span>YouTube</button>
    <button class="quick-btn" onclick="send('Open WhatsApp')"><span class="icon">💬</span>WhatsApp</button>
    <button class="quick-btn" onclick="send('Open VS Code')"><span class="icon">🖥</span>VS Code</button>
    <button class="quick-btn" onclick="send('Open calculator')"><span class="icon">🔢</span>Calculator</button>

    <div class="sidebar-title" style="margin-top:8px">Status</div>
    <div class="info-box" id="info-box">
      <div>Provider: <span id="info-provider">—</span></div>
      <div>Model: <span id="info-model">—</span></div>
      <div>Tools: <span id="info-tools">—</span></div>
      <div>Tier: <span id="info-tier">—</span></div>
    </div>
  </aside>

  <!-- Chat -->
  <div class="chat-area">
    <div id="messages">
      <div class="msg system-msg">
        <div class="system-pill">Jarvis is ready — type a message or use the quick commands</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="user-input" rows="1"
          placeholder="Ask anything or give a command... (Enter to send, Shift+Enter for new line)"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">Send ➤</button>
      </div>
      <div class="input-hint">
        Try: "open whatsapp" · "take a screenshot" · "what files are on my desktop" · "how much RAM am I using"
      </div>
    </div>
  </div>
</div>

<!-- Settings Panel -->
<div class="panel-overlay" id="settings-panel">
  <div class="panel">
    <h2>&#9881; Settings</h2>
    <div class="field">
      <label>Assistant Name</label>
      <input type="text" id="cfg-name" />
    </div>
    <div class="field">
      <label>LLM Provider</label>
      <select id="cfg-provider" onchange="toggleProvider()">
        <option value="groq">Groq (cloud, free, fast)</option>
        <option value="ollama">Ollama (local)</option>
      </select>
    </div>
    <div id="groq-fields">
      <div class="field">
        <label>Groq API Key &nbsp;<a href="https://console.groq.com/keys" target="_blank" style="color:var(--accent);font-size:11px">Get free key &rarr;</a></label>
        <input type="password" id="cfg-groq-key" placeholder="gsk_..." />
      </div>
      <div class="field">
        <label>Groq Model</label>
        <select id="cfg-groq-model">
          <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile (best)</option>
          <option value="llama3-8b-8192">llama3-8b-8192 (fastest)</option>
          <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
          <option value="gemma2-9b-it">gemma2-9b-it</option>
        </select>
      </div>
    </div>
    <div id="ollama-fields" style="display:none">
      <div class="field">
        <label>Ollama Model</label>
        <input type="text" id="cfg-ollama-model" placeholder="llama3.2" />
      </div>
    </div>
    <div class="field">
      <label>System Prompt</label>
      <textarea id="cfg-prompt" rows="4"></textarea>
    </div>
    <div class="field">
      <label>Max Conversation History</label>
      <input type="number" id="cfg-history" min="1" max="100" />
    </div>
    <div style="margin-top:20px">
      <button class="panel-btn" onclick="saveSettings()">Save</button>
      <button class="panel-btn cancel" onclick="closeSettings()">Cancel</button>
    </div>
    <div class="save-msg" id="save-msg"></div>
  </div>
</div>

<script>
  // ── Session ID (unique per tab) ──────────────────────────
  const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2);

  // ── Auto-resize textarea ─────────────────────────────────
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ── Enter to send ────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Scroll to bottom ─────────────────────────────────────
  function scrollBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  }

  // ── Append a message bubble ──────────────────────────────
  function appendMessage(role, text, steps) {
    const container = document.getElementById('messages');

    // Remove typing indicator if present
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'user-av' : 'jarvis-av'}`;
    avatar.textContent = role === 'user' ? 'U' : 'J';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);

    // Agent steps
    if (steps && steps.length > 0) {
      const stepsDiv = document.createElement('div');
      stepsDiv.className = 'steps-container';
      steps.forEach(s => {
        if (s.type === 'final') return; // skip — shown in bubble
        const step = document.createElement('div');
        step.className = `step ${s.type}`;
        step.textContent = s.text;
        stepsDiv.appendChild(step);
      });
      if (stepsDiv.children.length > 0) {
        bubble.appendChild(stepsDiv);
      }
    }

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    scrollBottom();
  }

  // ── Format text (markdown-lite) ──────────────────────────
  function formatText(text) {
    // Code blocks
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g,
      (_, lang, code) => `<pre><code>${escHtml(code.trim())}</code></pre>`);
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Newlines
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Show typing indicator ────────────────────────────────
  function showTyping() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg jarvis';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="avatar jarvis-av">J</div>
      <div class="bubble">
        <div class="typing">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    container.appendChild(div);
    scrollBottom();
  }

  // ── System message ───────────────────────────────────────
  function appendSystem(text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg system-msg';
    div.innerHTML = `<div class="system-pill">${escHtml(text)}</div>`;
    container.appendChild(div);
    scrollBottom();
  }

  // ── Send a message ───────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    appendMessage('user', text, []);
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: SESSION_ID })
      });
      const data = await res.json();

      if (data.error) {
        appendMessage('jarvis', '⚠ ' + data.error, []);
      } else {
        appendMessage('jarvis', data.reply, data.steps || []);
      }
    } catch (err) {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
      appendMessage('jarvis', '⚠ Could not reach the server. Is it running?', []);
    }

    btn.disabled = false;
    input.focus();
  }

  // ── Quick send ───────────────────────────────────────────
  function send(text) {
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  // ── Clear chat ───────────────────────────────────────────
  async function clearChat() {
    await fetch('/api/clear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID })
    });
    document.getElementById('messages').innerHTML = '';
    appendSystem('Conversation cleared.');
  }

  // ── Settings ─────────────────────────────────────────────
  function toggleProvider() {
    const p = document.getElementById('cfg-provider').value;
    document.getElementById('groq-fields').style.display   = p === 'groq'   ? '' : 'none';
    document.getElementById('ollama-fields').style.display = p === 'ollama' ? '' : 'none';
  }

  async function openSettings() {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    document.getElementById('cfg-name').value         = cfg.assistant_name || '';
    document.getElementById('cfg-provider').value     = cfg.llm_provider   || 'groq';
    document.getElementById('cfg-groq-key').value     = cfg.groq_api_key === '***set***' ? '' : (cfg.groq_api_key || '');
    document.getElementById('cfg-groq-key').placeholder = cfg.groq_api_key === '***set***' ? '(key already saved)' : 'gsk_...';
    document.getElementById('cfg-groq-model').value   = cfg.groq_model     || 'llama-3.3-70b-versatile';
    document.getElementById('cfg-ollama-model').value = cfg.ollama_model   || 'llama3.2';
    document.getElementById('cfg-prompt').value       = cfg.system_prompt  || '';
    document.getElementById('cfg-history').value      = cfg.max_history    || 10;
    toggleProvider();
    document.getElementById('settings-panel').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-panel').classList.remove('open');
    document.getElementById('save-msg').textContent = '';
  }

  async function saveSettings() {
    const groqKey = document.getElementById('cfg-groq-key').value.trim();
    const body = {
      assistant_name: document.getElementById('cfg-name').value,
      llm_provider:   document.getElementById('cfg-provider').value,
      groq_model:     document.getElementById('cfg-groq-model').value,
      ollama_model:   document.getElementById('cfg-ollama-model').value,
      system_prompt:  document.getElementById('cfg-prompt').value,
      max_history:    parseInt(document.getElementById('cfg-history').value) || 10,
    };
    if (groqKey) body.groq_api_key = groqKey;
    await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    document.getElementById('save-msg').textContent = 'Saved!';
    setTimeout(closeSettings, 1000);
  }

  // Close panel on overlay click
  document.getElementById('settings-panel').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
  });

  // ── Status check ─────────────────────────────────────────
  async function checkStatus() {
    try {
      const res  = await fetch('/api/status');
      const data = await res.json();
      const dot   = document.getElementById('status-dot');
      const txt   = document.getElementById('status-text');
      const badge = document.getElementById('tier-badge');

      if (data.ok) {
        dot.classList.add('online');
        txt.textContent = `Online · ${data.provider} · ${data.model}`;
      } else {
        dot.classList.remove('online');
        txt.textContent = data.error ? data.error.slice(0, 60) : 'LLM offline';
      }

      badge.textContent = (data.tier || 'free').toUpperCase();
      badge.className   = 'badge ' + (data.tier || 'free');
      document.getElementById('info-model').textContent = data.model;
      document.getElementById('info-tools').textContent = data.tools;
      document.getElementById('info-tier').textContent  = data.tier;
    } catch (e) {
      document.getElementById('status-text').textContent = 'Server offline';
    }
  }

  // Check status on load and every 30s
  checkStatus();
  setInterval(checkStatus, 30000);

  // Focus input on load
  document.getElementById('user-input').focus();
</script>
</body>
</html>
